<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#15131b"
    >

    <title>TBR Spinner</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">

            <h1>📚 TBR Spinner</h1>

            <p>
                Let the wheel choose your next read
            </p>

        </header>


        <section class="wheel-container">

            <div
                class="pointer"
                aria-hidden="true"
            ></div>

            <canvas
                id="wheel"
                width="700"
                height="700"
                aria-label="TBR spinner wheel"
            ></canvas>

        </section>


        <button
            class="spin-button"
            id="spinButton"
            type="button"
        >
            SPIN
        </button>


        <div
            class="spinning-message"
            id="spinningMessage"
            aria-live="polite"
        ></div>


        <div class="helper-text">
            Spin the wheel and let fate choose your book ✨
        </div>

    </main>


    <!-- RESULT POPUP -->

    <div
        class="result-overlay"
        id="resultOverlay"
        aria-hidden="true"
    >

        <div
            class="result-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resultText"
        >

            <div
                class="result-icon"
                aria-hidden="true"
            >
                📖
            </div>


            <div class="result-label">
                YOUR PROMPT
            </div>


            <h2
                class="result-text"
                id="resultText"
            >
                Free pick
            </h2>


            <div class="result-actions">

                <button
                    class="close-button"
                    id="closeResult"
                    type="button"
                >
                    Keep it
                </button>


                <button
                    class="again-button"
                    id="spinAgain"
                    type="button"
                >
                    Spin again
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
