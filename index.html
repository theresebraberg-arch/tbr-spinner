<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#fff7fb"
    >

    <title>TBR Spinner</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="styles.css?v=2"
    >
</head>


<body>

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <h1>
                📚 TBR Spinner
            </h1>

            <p>
                Let the wheel choose your next read
            </p>

        </header>


        <!-- WHEEL -->

        <section class="wheel-container">

            <div
                class="pointer"
                aria-hidden="true"
            ></div>

            <canvas
                id="wheel"
                width="700"
                height="700"
                aria-label="TBR spinner wheel"
            ></canvas>

        </section>


        <!-- SPIN BUTTON -->

        <button
            class="spin-button"
            id="spinButton"
            type="button"
        >
            SPIN
        </button>


        <!-- SPINNING MESSAGE -->

        <div
            class="spinning-message"
            id="spinningMessage"
            aria-live="polite"
        ></div>


        <!-- LITTLE TEXT -->

        <div class="helper-text">
            Spin the wheel and let fate choose your book ✨
        </div>

    </main>


    <!-- ===================================
         RESULT POPUP
         =================================== -->

    <div
        class="result-overlay"
        id="resultOverlay"
        aria-hidden="true"
    >

        <div
            class="result-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resultText"
        >

            <!-- ICON -->

            <div
                class="result-icon"
                aria-hidden="true"
            >
                📖
            </div>


            <!-- LABEL -->

            <div class="result-label">
                YOUR PROMPT
            </div>


            <!-- RESULT -->

            <h2
                class="result-text"
                id="resultText"
            >
                Free pick
            </h2>


            <!-- BUTTONS -->

            <div class="result-actions">

                <button
                    class="close-button"
                    id="closeResult"
                    type="button"
                >
                    Keep it
                </button>


                <button
                    class="again-button"
                    id="spinAgain"
                    type="button"
                >
                    Spin again
                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js?v=2"></script>

</body>

</html>
