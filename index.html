<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#fff7fb"
    >

    <title>TBR Spinner</title>

    <link
        rel="stylesheet"
        href="styles.css?v=3"
    >
</head>


<body>

    <main class="app">

        <header class="header">

            <h1>
                📚 TBR Spinner
            </h1>

            <p>
                Let the wheel choose your next read
            </p>

        </header>


        <section class="wheel-container">

            <div
                class="pointer"
                aria-hidden="true"
            ></div>

            <canvas
                id="wheel"
                width="700"
                height="700"
                aria-label="TBR spinner wheel"
            ></canvas>

        </section>


        <button
            class="spin-button"
            id="spinButton"
            type="button"
        >
            SPIN
        </button>


        <div
            class="spinning-message"
            id="spinningMessage"
            aria-live="polite"
        ></div>


        <div class="helper-text">
            Spin the wheel and let fate choose your book ✨
        </div>

    </main>

<button
    class="spin-button"
    id="testColorButton"
    type="button"
    style="margin-top: 14px; font-size: 14px; padding: 10px 22px;"
>
    TEST COLOR GENERATOR
</button>
    
    <!-- RESULT POPUP -->

    <div
        class="result-overlay"
        id="resultOverlay"
        aria-hidden="true"
    >

        <div
            class="result-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resultText"
        >

            <div
                class="result-icon"
                id="resultIcon"
                aria-hidden="true"
            >
                📖
            </div>


            <div
                class="result-label"
                id="resultLabel"
            >
                YOUR PROMPT
            </div>


            <h2
                class="result-text"
                id="resultText"
            >
                Free pick
            </h2>


            <p
                class="result-description"
                id="resultDescription"
            ></p>


            <div class="result-actions">

                <button
                    class="close-button"
                    id="closeResult"
                    type="button"
                >
                    Keep it
                </button>


                <button
                    class="again-button"
                    id="spinAgain"
                    type="button"
                >
                    Spin again
                </button>

            </div>

        </div>

    </div>


    <!-- COLOR GENERATOR -->

    <div
        class="generator-overlay"
        id="colorGeneratorOverlay"
        aria-hidden="true"
    >

        <div
            class="generator-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="colorGeneratorTitle"
        >

            <button
                class="generator-close"
                id="closeColorGenerator"
                type="button"
                aria-label="Close color generator"
            >
                ×
            </button>


            <div class="generator-heading">

                <div class="generator-icon">
                    🎨
                </div>

                <div>

                    <div class="generator-kicker">
                        MINI WHEEL
                    </div>

                    <h2 id="colorGeneratorTitle">
                        Color Generator
                    </h2>

                </div>

            </div>


            <p class="generator-intro">
                Spin to choose the color your book should have on the cover.
            </p>


            <div class="mini-wheel-container">

                <div
                    class="mini-pointer"
                    aria-hidden="true"
                ></div>

                <canvas
                    id="colorWheel"
                    width="500"
                    height="500"
                    aria-label="Color generator wheel"
                ></canvas>

            </div>


            <div
                class="generator-result"
                id="colorResult"
                aria-live="polite"
            >
                Ready to spin 🎨
            </div>


            <button
                class="generator-spin-button"
                id="spinColorButton"
                type="button"
            >
                SPIN COLOR
            </button>

        </div>

    </div>


    <script src="script.js?v=3"></script>

</body>

</html>
